apiVersion: v1
kind: ConfigMap
metadata:
  name: wealthin-config
  namespace: wealthin
data:
  LLM_PROVIDER: "gemini"
  LLM_FALLBACK: "none"
  DEMO_MODE: "true"
  RATE_LIMIT_PER_MINUTE: "15"
  MAX_AGENT_STEPS: "6"
  LOG_LEVEL: "INFO"
---
# EXAMPLE ONLY — do not commit real keys.
# Create the real secret with:
#   kubectl -n wealthin create secret generic wealthin-secrets \
#     --from-literal=GEMINI_API_KEY=your_key \
#     --from-literal=GROQ_API_KEY=your_key
apiVersion: v1
kind: Secret
metadata:
  name: wealthin-secrets
  namespace: wealthin
type: Opaque
stringData:
  GEMINI_API_KEY: "replace-me"
  GROQ_API_KEY: ""
