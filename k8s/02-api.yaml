apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthin-api
  namespace: wealthin
  labels: { app: wealthin-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wealthin-api }
  template:
    metadata:
      labels: { app: wealthin-api }
    spec:
      containers:
        - name: api
          # Built and pushed by CI. Replace <owner> with your GitHub username.
          image: ghcr.io/<owner>/wealthin-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: wealthin-config }
            - secretRef: { name: wealthin-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: wealthin-api
  namespace: wealthin
spec:
  selector: { app: wealthin-api }
  ports:
    - port: 8000
      targetPort: 8000
